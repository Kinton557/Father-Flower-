<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discipline and duty | Boarding</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="../bursar/css/bursar.css">
</head>
<body>
<script type="module">
/*
 * boarding/discipline.html
 * Purpose: boarding merits and demerits, duty roster, and prefect lists.
 * Role allowed: boarding, admin.
 * Collections used: discipline (source == "boarding"), boardingDuty, prefects, hostels (read), learners (lookup).
 */
import { requireRole } from '../shared/auth.js';
import { db, fs } from '../shared/firebase.js';
import { esc, renderShell } from '../shared/ui.js';
import { mountCrud } from '../bursar/js/crud.js';
import { BOARDING_NAV, loadHostels, tabs, showErr } from '../bursar/js/common.js';

const hostelOptions = async (p) => (await loadHostels(p)).map((h) => ({ v: h.id, l: h.name }));

requireRole(['boarding', 'admin'], async (profile) => {
  const main = renderShell({ role: profile.role, title: 'Discipline and duty', nav: BOARDING_NAV });
  main.innerHTML = `<div class="b-head"><h1>Discipline and duty</h1></div>
    <div class="b-tabs" role="tablist"><button data-tab="d" type="button" role="tab">Merits and demerits</button><button data-tab="r" type="button" role="tab">Duty roster</button><button data-tab="p" type="button" role="tab">Prefects</button></div>
    <div data-panel="d"></div><div data-panel="r" hidden></div><div data-panel="p" hidden></div>`;
  const cfgs = {
    d: {
      collection: 'discipline', newLabel: 'Record merit or demerit', empty: 'Nothing recorded yet.', auditSave: true,
      where: () => [fs.where('source', '==', 'boarding')],
      defaults: (p) => ({ source: 'boarding', reportedBy: p.uid, reportedByName: p.fullName || '' }),
      fields: [
        { key: 'learnerId', label: 'Learner reg number', type: 'learner', required: true, boarderOnly: true },
        { key: 'type', label: 'Type', type: 'select', required: true, options: [{ v: 'merit', l: 'Merit' }, { v: 'demerit', l: 'Demerit' }] },
        { key: 'points', label: 'Points', type: 'number', required: true, min: 1, max: 50 },
        { key: 'date', label: 'Date', type: 'date', required: true, today: true },
        { key: 'description', label: 'What happened', type: 'textarea', required: true, wide: true },
        { key: 'parentNotified', label: 'Parent has been told', type: 'checkbox' }
      ],
      columns: [
        { label: 'Learner', html: (r) => `${esc(r.learnerName || '')}<br><small>${esc(r.learnerId)}</small>` },
        { label: 'Type', html: (r) => `<span class="b-tag ${r.type === 'merit' ? 'ok' : 'bad'}">${esc(r.type)}</span> ${esc(String(r.points))}` },
        { label: 'Date', key: 'date', type: 'date' }, { label: 'Details', html: (r) => esc(r.description || '') },
        { label: 'Parent told', key: 'parentNotified', type: 'checkbox' }
      ],
      summary: async (rows) => {
        const m = rows.filter((r) => r.type === 'merit').reduce((s, r) => s + (r.points || 0), 0), d = rows.filter((r) => r.type === 'demerit').reduce((s, r) => s + (r.points || 0), 0);
        return `<div class="b-cards"><div class="b-card"><div class="k">Merit points</div><div class="v">${m}</div></div><div class="b-card"><div class="k">Demerit points</div><div class="v">${d}</div></div></div>`;
      }
    },
    r: {
      collection: 'boardingDuty', newLabel: 'Add duty', empty: 'No duties set.', sort: (a, b) => (b.date || '').localeCompare(a.date || ''),
      fields: [
        { key: 'date', label: 'Date', type: 'date', required: true, today: true },
        { key: 'duty', label: 'Duty', type: 'select', required: true, options: ['Night duty', 'Prep supervision', 'Meals supervision', 'Weekend duty', 'Sick bay cover', 'Other'] },
        { key: 'staffName', label: 'Staff member', type: 'text', required: true, max: 100 },
        { key: 'hostelId', label: 'Hostel', type: 'select', options: hostelOptions },
        { key: 'notes', label: 'Notes', type: 'text', max: 200, wide: true }
      ]
    },
    p: {
      collection: 'prefects', newLabel: 'Appoint prefect', empty: 'No prefects appointed.', auditSave: false,
      fields: [
        { key: 'learnerId', label: 'Learner reg number', type: 'learner', required: true, boarderOnly: true },
        { key: 'role', label: 'Role', type: 'select', required: true, options: ['Head boy', 'Head girl', 'Hostel prefect', 'Dining prefect', 'Prep prefect', 'Sports prefect', 'Other'] },
        { key: 'hostelId', label: 'Hostel', type: 'select', options: hostelOptions },
        { key: 'appointedOn', label: 'Appointed on', type: 'date', today: true }
      ],
      columns: [
        { label: 'Learner', html: (r) => `${esc(r.learnerName || '')}<br><small>${esc(r.learnerId)} ${esc(r.form || '')}</small>` },
        { label: 'Role', key: 'role' }, { label: 'Appointed', key: 'appointedOn', type: 'date' }
      ]
    }
  };
  const mounted = {};
  tabs(main, async (n) => {
    if (mounted[n]) return; mounted[n] = true;
    const host = main.querySelector(`[data-panel="${n}"]`);
    try { await mountCrud(host, cfgs[n], profile); } catch (e) { showErr(host, e); }
  })('d');
});
</script>
</body>
</html>
