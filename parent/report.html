<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Report cards · Father Flower</title><link rel="stylesheet" href="../shared/ui.css"></head><body>
<script type="module">
/* parent/report.html — purpose: parent views/downloads published report cards for their own children.
   Role: parent (admin may preview). Collections: learners (guardianUids array-contains uid), reports, terms, classes, campuses, accounts */
import { requireRole } from '../shared/auth.js';
import { renderShell } from '../shared/ui.js';
import { NAV, injectStyles, getChildren } from './js/common.js';
import { mountReport } from '../learner/js/reportView.js';
requireRole(['parent', 'admin'], async p => {
  injectStyles();
  const main = renderShell({ role: 'parent', title: 'Report cards', nav: NAV });
  main.innerHTML = '<p class="muted">Loading…</p>';
  try { await mountReport(main, await getChildren(p)); }
  catch (e) { console.error(e); main.innerHTML = '<div class="tcard">Could not load. Refresh and try again.</div>'; }
});
</script></body></html>
