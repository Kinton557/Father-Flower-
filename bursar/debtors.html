<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debtors | Bursar</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="../shared/ui.css">
<link rel="stylesheet" href="./css/bursar.css">
</head>
<body>
<script type="module">
/*
 * bursar/debtors.html
 * Purpose: learners who owe fees. Filter by campus, form and amount, export CSV, and send a parent message
 *          (copy text or open WhatsApp) from an editable template.
 * Role allowed: bursar, admin.
 * Collections used: accounts, learners (guardian phone, read on demand), campuses, settings/school.
 */
import { requireRole } from '../shared/auth.js';
import { db, fs } from '../shared/firebase.js';
import { esc, toast, renderShell } from '../shared/ui.js';
import { navFor, campusScope, loadCampuses, getSchool, opts, usd, toCents, downloadCSV, todayISO, FORMS, showErr } from './js/common.js';

const TPL_KEY = 'ff_bursar_msg_tpl';
const DEFAULT_TPL = 'Dear {parent}, this is a friendly reminder from {school}. The fees balance for {learner} ({reg}) is {amount}. Please settle it at the bursar\'s office or send your EcoCash or bank reference to the school. Thank you.';

requireRole(['bursar', 'admin'], async (profile) => {
  const main = renderShell({ role: profile.role, title: 'Debtors', nav: navFor(profile.role) });
  main.innerHTML = `
    <div class="b-head"><h1>Debtors</h1><button class="b-btn" id="csv" type="button">Export CSV</button></div>
    <div id="sum"></div>
    <div class="b-filters">
      <label id="campusWrap">Campus<select id="fCampus"></select></label>
      <label>Form<select id="fForm"><option value="">All forms</option>${FORMS.map((f) => `<option>${f}</option>`).join('')}</select></label>
      <label>Owing at least (USD)<input id="fMin" inputmode="decimal" placeholder="0.00"></label>
      <label>Owing at most (USD)<input id="fMax" inputmode="decimal" placeholder="No limit"></label>
      <label>Sort by<select id="fSort"><option value="amt">Highest balance</option><option value="name">Name</option><option value="form">Form</option></select></label>
    </div>
    <div class="b-actions" style="margin:0 0 14px"><button class="b-btn" id="apply" type="button">Apply filters</button></div>
    <section class="b-panel"><h2 class="b-h2">Message to parents</h2>
      <label style="display:flex;flex-direction:column;gap:4px;font-size:.85rem">Template. Use {parent} {learner} {reg} {amount} {school}<textarea id="tpl" class="b-in" rows="4" maxlength="600" style="min-height:96px"></textarea></label>
      <div class="b-actions"><button class="b-btn b-ghost" id="saveTpl" type="button">Save template on this device</button><button class="b-btn b-ghost" id="resetTpl" type="button">Reset</button></div></section>
    <div id="list"><div class="b-skel"></div></div>
    <div class="b-actions"><button class="b-btn b-ghost" id="more" type="button" hidden>Load more</button></div>`;
  const $ = (s) => main.querySelector(s);
  const list = $('#list');
  let campuses = [], school = {}, rows = [], limitN = 300;
  try { [campuses, school] = await Promise.all([loadCampuses(profile), getSchool()]); } catch (e) { showErr(list, e); return; }
  const multi = !campusScope(profile);
  $('#fCampus').innerHTML = (multi ? '<option value="">All campuses</option>' : '') + opts(campuses, (c) => c.id, (c) => c.name, '');
  if (!multi) $('#campusWrap').hidden = true;
  const campusName = (id) => (campuses.find((c) => c.id === id) || {}).name || id || '';
  try { $('#tpl').value = localStorage.getItem(TPL_KEY) || DEFAULT_TPL; } catch { $('#tpl').value = DEFAULT_TPL; }
  $('#saveTpl').addEventListener('click', () => { try { localStorage.setItem(TPL_KEY, $('#tpl').value); toast('Template saved on this device', 'success'); } catch { toast('Could not save here', 'error'); } });
  $('#resetTpl').addEventListener('click', () => { $('#tpl').value = DEFAULT_TPL; });

  async function load() {
    list.innerHTML = '<div class="b-skel"></div>';
    try {
      const cid = campusScope(profile) || $('#fCampus').value;
      const base = cid ? [fs.where('campusId', '==', cid)] : [];
      let snap;
      try {
        snap = await fs.getDocs(fs.query(fs.collection(db, 'accounts'), ...base, fs.where('balanceCents', '>', 0), fs.orderBy('balanceCents', 'desc'), fs.limit(limitN)));
      } catch (err) {
        // Composite index missing: fall back to a campus query filtered here.
        console.warn('Falling back without index', err);
        snap = await fs.getDocs(fs.query(fs.collection(db, 'accounts'), ...base, fs.limit(1000)));
      }
      rows = snap.docs.map((d) => ({ id: d.id, ...d.data() })).filter((a) => a.balanceCents > 0);
      $('#more').hidden = snap.size < limitN;
      render();
    } catch (e) { showErr(list, e); }
  }

  const filtered = () => {
    const form = $('#fForm').value;
    const min = toCents($('#fMin').value);
    const max = $('#fMax').value.trim() ? toCents($('#fMax').value) : Infinity;
    let r = rows.filter((a) => (!form || a.form === form) && a.balanceCents >= min && a.balanceCents <= max);
    const s = $('#fSort').value;
    r.sort(s === 'name' ? (a, b) => (a.learnerName || '').localeCompare(b.learnerName || '') : s === 'form' ? (a, b) => FORMS.indexOf(a.form) - FORMS.indexOf(b.form) || (a.learnerName || '').localeCompare(b.learnerName || '') : (a, b) => b.balanceCents - a.balanceCents);
    return r;
  };

  function render() {
    const r = filtered();
    const total = r.reduce((s, a) => s + a.balanceCents, 0);
    $('#sum').innerHTML = `<div class="b-cards"><div class="b-card"><div class="k">Debtors shown</div><div class="v">${r.length}</div></div><div class="b-card"><div class="k">Total owing</div><div class="v">${usd(total)}</div></div></div>`;
    if (!r.length) { list.innerHTML = '<div class="b-empty">No debtors match these filters.</div>'; return; }
    list.innerHTML = `<table class="b-table stack"><thead><tr><th>Learner</th><th>Form</th><th>Campus</th><th class="b-num">Balance</th><th></th></tr></thead><tbody>
      ${r.map((a) => `<tr><td data-label="Learner">${esc(a.learnerName)}<br><small>${esc(a.regNumber || a.id)}</small></td><td data-label="Form">${esc(a.form || '')}</td><td data-label="Campus">${esc(campusName(a.campusId))}</td><td data-label="Balance" class="b-num b-pos">${usd(a.balanceCents)}</td>
        <td><div class="b-actions" style="margin:0"><button class="b-btn b-ghost" data-wa="${esc(a.id)}" type="button">WhatsApp</button><button class="b-btn b-ghost" data-cp="${esc(a.id)}" type="button">Copy message</button><a class="b-btn b-ghost" href="accounts.html?learner=${encodeURIComponent(a.id)}">Statement</a></div></td></tr>`).join('')}</tbody></table>`;
  }

  async function guardian(a) {
    try {
      const s = await fs.getDoc(fs.doc(db, 'learners', a.id));
      if (s.exists()) { const l = s.data(); return { name: l.guardianName || 'Parent or guardian', phone: l.guardianPhone || '' }; }
    } catch (e) { console.error(e); }
    return { name: 'Parent or guardian', phone: '' };
  }
  const fill = (a, g) => $('#tpl').value
    .replaceAll('{parent}', g.name).replaceAll('{learner}', a.learnerName || '').replaceAll('{reg}', a.regNumber || a.id)
    .replaceAll('{amount}', usd(a.balanceCents)).replaceAll('{school}', school.name || 'Father Flower Educational Network');
  const waNumber = (p) => { const d = String(p || '').replace(/\D/g, ''); if (!d) return ''; if (d.startsWith('263')) return d; if (d.startsWith('0')) return '263' + d.slice(1); return d; };

  list.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const id = b.dataset.wa || b.dataset.cp;
    if (!id) return;
    const a = rows.find((x) => x.id === id);
    b.disabled = true;
    const g = await guardian(a);
    const msg = fill(a, g);
    if (b.dataset.cp) {
      try { await navigator.clipboard.writeText(msg); toast('Message copied', 'success'); } catch { toast('Could not copy. Select the template text instead.', 'error'); }
    } else {
      const num = waNumber(g.phone);
      if (!num) toast('No guardian phone number on this learner. Opening WhatsApp without a number.', 'info');
      window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
    }
    b.disabled = false;
  });

  $('#csv').addEventListener('click', () => {
    const r = filtered();
    if (!r.length) { toast('Nothing to export.', 'info'); return; }
    downloadCSV(`debtors-${todayISO()}.csv`, [['Reg number', 'Finance number', 'Learner', 'Form', 'Campus', 'Total due', 'Total paid', 'Balance'],
      ...r.map((a) => [a.regNumber || a.id, a.financeRegNumber || '', a.learnerName || '', a.form || '', campusName(a.campusId), (a.totalDueCents / 100).toFixed(2), (a.totalPaidCents / 100).toFixed(2), (a.balanceCents / 100).toFixed(2)])]);
  });
  $('#apply').addEventListener('click', () => (rows.length ? render() : load()));
  $('#fCampus').addEventListener('change', load);
  $('#fSort').addEventListener('change', render);
  $('#more').addEventListener('click', () => { limitN += 300; load(); });
  load();
});
</script>
</body>
</html>
